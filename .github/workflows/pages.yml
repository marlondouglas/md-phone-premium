name: MD PHONE Universe — publicar loja premium

on:
  push:
    branches: [main]
    paths:
      - index.html
      - md-elevate.css
      - md-elevate.js
      - md-universe-data.js
      - scripts/prepare-catalog-media.cjs
      - scripts/clean-product-photography.py
      - scripts/render-elevate-film.py
      - scripts/render-elevate-stories.py
      - assets/**
      - assets/md-phone-brand-mark.svg
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: md-phone-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validar nova loja MD PHONE Universe
        shell: bash
        run: |
          set -euo pipefail
          node --check md-universe-data.js
          node --check md-elevate.js
          python3 -m py_compile scripts/clean-product-photography.py scripts/render-elevate-stories.py
          node --check scripts/prepare-catalog-media.cjs
          test -s index.html
          test -s md-elevate.css
          test -s md-universe-data.js
          test -s md-elevate.js
          test -s assets/md-phone-brand-mark.svg
          grep -q 'md-elevate.css' index.html
          grep -q 'md-universe-data.js' index.html
          grep -q 'md-elevate.js' index.html
          ! grep -q 'md-universe.css' index.html
          ! grep -q 'md-2026.css' index.html
          ! grep -q 'app.js' index.html
          mkdir -p _site/assets
          cp index.html md-elevate.css md-elevate.js md-universe-data.js _site/
          cp -R assets/. _site/assets/
          node scripts/prepare-catalog-media.cjs
          python3 -m venv /tmp/md-photo-env
          /tmp/md-photo-env/bin/python -m pip install --quiet pillow imageio-ffmpeg
          /tmp/md-photo-env/bin/python scripts/clean-product-photography.py
          /tmp/md-photo-env/bin/python scripts/render-elevate-stories.py
          test -s _site/md-stories-manifest.js
          test -s _site/md-photo-audit.json
          test -s _site/md-photo-manifest.js
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Enviar MD PHONE Universe
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
