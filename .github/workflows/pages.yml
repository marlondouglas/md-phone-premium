name: MD PHONE — publicar nova experiência 2026

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: md-phone-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar MD PHONE 2026
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validar reconstrução integral
        shell: bash
        run: |
          set -euo pipefail
          node --check md-2026.js
          test -s index.html
          test -s md-2026.css
          test -s md-2026.js
          test -s assets/md-phone-brand-mark.svg
          grep -q 'md-2026.css' index.html
          grep -q 'md-2026.js' index.html
          grep -q 'id="checkoutForm"' index.html
          ! grep -q 'md-retail.css' index.html
          ! grep -q 'md-ultra.css' index.html
          mkdir -p _site/assets
          cp index.html md-2026.css md-2026.js _site/
          cp assets/md-phone-brand-mark.svg _site/assets/
          touch _site/.nojekyll
          echo "Nova página MD PHONE pronta para publicação"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Enviar site estático
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
