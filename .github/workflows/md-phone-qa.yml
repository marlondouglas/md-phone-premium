name: MD PHONE Universe / Teste visual e funcional
on:
  push:
    branches: [main]
    paths:
      - index.html
      - md-universe.css
      - md-universe.js
      - md-universe-data.js
      - .github/workflows/md-phone-qa.yml
  workflow_dispatch:

permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obter site
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preparar Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Conferir visual e compra
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-screenshots
          python3 -m http.server 8765 >/tmp/md-phone-server.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            const errors=[];
            const checks=[];
            for(const [name,width,height] of [['desktop',1440,900],['mobile',390,844]]){
              const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
              page.on('pageerror',e=>errors.push(name+' JS error '+e.message));
              const u='http://127.0.0.1:8765/index.html';
              await page.goto(u,{waitUntil:'domcontentloaded'});
              await page.waitForSelector('.category-tile',{timeout:20000});
              await page.screenshot({path:'qa-screenshots/'+name+'-home.png',fullPage:true});
              let count=await page.locator('.category-tile').count();
              if(count!==7)errors.push(name+': 7 categorias esperadas, recebidas '+count);
              if(await page.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth+4))errors.push(name+': rolagem horizontal na home');
              if(name==='mobile'){
                await page.locator('#hamburger').click();
                if(!(await page.locator('#mobileMenu').isVisible()))errors.push('menu celular não abre');
              }
              await page.goto(u+'?categoria=iphone',{waitUntil:'domcontentloaded'});
              await page.waitForSelector('.model-stage',{timeout:20000});
              const modelCount=await page.locator('.model-tab').count();
              if(modelCount!==31)errors.push(name+': esperado 31 modelos iPhone, encontrado '+modelCount);
              const xrColors=await page.locator('.md-color-swatch').count();
              if(xrColors!==6)errors.push(name+': iPhone XR deveria apresentar seis cores, encontrado '+xrColors);
              await page.locator('[data-color-name="Coral"]').click();
              const chosen=await page.locator('.md-color-current').innerText();
              if(chosen!=='Coral')errors.push(name+': cor Coral não foi selecionada');
              if(await page.locator('[data-phone-era]').count()!==4)errors.push(name+': filtros por geração ausentes');
              await page.locator('.model-tab').nth(2).click();
              if(!(await page.locator('.model-stage h3').innerText()).includes('iPhone'))errors.push(name+': troca do modelo falhou');
              await page.screenshot({path:'qa-screenshots/'+name+'-iphone.png',fullPage:true});
              await page.goto(u+'?produto=iphone-18-pro-max',{waitUntil:'domcontentloaded'});
              await page.waitForSelector('.product-hero',{timeout:20000});
              const title=await page.locator('.product-copy h1').innerText();
              if(!title.includes('iPhone 18 Pro Max'))errors.push(name+': página individual incorreta '+title);
              const colors=await page.locator('[data-color-name]').count();
              if(colors!==4)errors.push(name+': iPhone 18 Pro Max deveria apresentar quatro cores, encontrou '+colors);
              await page.locator('[data-color-name="Preto"]').click();
              if((await page.locator('.md-color-current').innerText())!=='Preto')errors.push(name+': cor Preto não selecionada');
              await page.screenshot({path:'qa-screenshots/'+name+'-produto.png',fullPage:true});
              await page.locator('[data-buy]').first().click();
              if(!(await page.locator('#buyDialog').evaluate(el=>el.open)))errors.push(name+': compra não abriu');
              await page.locator('#buyerName').fill('Cliente Teste');
              await page.locator('#buyerPhone').fill('33999999999');
              await page.locator('#buyerConsent').check();
              await page.evaluate(()=>{
                window.__waCaptured='';
                HTMLAnchorElement.prototype.click=function(){window.__waCaptured=this.href;};
              });
              await page.locator('#buyForm button[type=submit]').click();
              const wa=await page.evaluate(()=>window.__waCaptured);
              if(!wa.startsWith('https://wa.me/5533987044866?text='))errors.push(name+': compra não prepara WhatsApp');
              if(!decodeURIComponent(wa).includes('Cor desejada (sujeita à confirmação): Preto'))errors.push(name+': cor escolhida não seguiu para WhatsApp');
              await page.screenshot({path:'qa-screenshots/'+name+'-checkout.png',fullPage:false});
              checks.push({name,categoryCount:count,iphoneModels:modelCount,whatsapp:!!wa});
              await page.close();
            }
            await browser.close();
            console.log('QA RESULTS',JSON.stringify(checks));
            if(errors.length){console.error('QA FAILED',JSON.stringify(errors));process.exit(1)}
            console.log('QA PASSOU');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Salvar imagens do teste
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: md-phone-universe-desktop-mobile
          path: qa-screenshots/
          if-no-files-found: warn
      - name: Publicar capturas para revisão
        if: success()
        shell: bash
        run: |
          mkdir -p qa-snapshots
          cp qa-screenshots/*.png qa-snapshots/
          git config user.name "MD Phone QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add qa-snapshots/
          if ! git diff --cached --quiet; then
            git commit -m "Visual QA: capturas de MD Phone Universe desktop e celular"
            git push
          fi
