name: MD PHONE · Visual QA
on:
  push:
    branches: [main]
    paths:
      - index.html
      - md-2026.css
      - md-2026.js
      - .github/workflows/md-phone-qa.yml
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Testar e fotografar telas
        run: |
          python3 -m http.server 8765 >/tmp/mdphone-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            fs.mkdirSync('qa-screenshots',{recursive:true});
            const browser=await chromium.launch({headless:true});
            const errors=[];
            for(const [name,width,height] of [['desktop',1440,900],['mobile',390,844]]){
              const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
              page.on('pageerror',error=>errors.push(name+': '+error.message));
              await page.goto('http://127.0.0.1:8765/',{waitUntil:'domcontentloaded'});
              await page.locator('.product-panel').first().waitFor({timeout:20000});
              await page.screenshot({path:'qa-screenshots/'+name+'.png',fullPage:true});
              const count=await page.locator('.product-panel').count();
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth+3);
              if(count!==6)errors.push(name+': expected 6 product panels, got '+count);
              if(overflow)errors.push(name+': horizontal overflow detected');
              if(name==='mobile'){
                await page.locator('#menuToggle').click();
                if(!(await page.locator('#mobileNav').isVisible()))errors.push('Mobile menu did not open');
                await page.locator('#menuToggle').click();
              }
              await page.locator('[data-buy="18pro"]').first().click();
              if(!(await page.locator('#checkout').evaluate(el=>el.open)))errors.push(name+': buy dialog not open');
              await page.locator('#buyerName').fill('Cliente Teste');
              await page.locator('#buyerPhone').fill('33999999999');
              await page.locator('#buyerConsent').check();
              const hrefs=[];
              await page.route('https://wa.me/**',route=>{hrefs.push(route.request().url());route.abort()});
              await page.locator('#checkoutForm button[type=submit]').click();
              await page.waitForTimeout(400);
              if(hrefs.length===0)errors.push(name+': no WhatsApp link triggered');
              console.log(JSON.stringify({screen:name,count,overflow,whatsappAttempted:hrefs.length>0}));
              await page.close();
            }
            await browser.close();
            if(errors.length){console.error('QA FAILED',errors);process.exit(1)}
            console.log('QA PASSED');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: md-phone-desktop-mobile
          path: qa-screenshots/
          if-no-files-found: warn