name: MD PHONE Universe · QA visual
on:
  push:
    branches: [main]
    paths:
      - index.html
      - '*.html'
      - md-universe.css
      - md-universe-data.js
      - md-universe-app.js
      - .github/workflows/md-phone-qa.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Testar site em navegadores desktop e celular
        shell: bash
        run: |
          python3 -m http.server 8765 >/tmp/mdphone-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          const fs=require('fs');
          (async()=>{
            fs.mkdirSync('qa-screenshots',{recursive:true});
            const browser=await chromium.launch({headless:true});
            const errors=[];
            for(const [name,width,height] of [['desktop',1440,900],['mobile',390,844]]){
              const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
              page.on('pageerror',e=>errors.push(name+': '+e.message));
              await page.goto('http://127.0.0.1:8765/index.html',{waitUntil:'domcontentloaded'});
              await page.locator('.hero-slide.active').waitFor({timeout:20000});
              if(await page.locator('.category-tile').count()!==7)errors.push(name+': homepage missing 7 categories');
              await page.waitForTimeout(1800);
              await page.screenshot({path:'qa-screenshots/home-'+name+'.png',fullPage:true});
              if(await page.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth+3))errors.push(name+': horizontal overflow on home');
              if(name==='mobile'){
                await page.locator('#menuButton').click();
                if(!(await page.locator('#mobileMenu').isVisible()))errors.push('Mobile menu failed');
                await page.locator('#menuButton').click();
              }
              await page.goto('http://127.0.0.1:8765/iphone.html',{waitUntil:'domcontentloaded'});
              await page.locator('.model-stage').waitFor({timeout:20000});
              if(await page.locator('.model-tab').count()<6)errors.push(name+': iPhone models missing');
              if(await page.locator('.model-stage').count()!==1)errors.push(name+': duplicated product showcase');
              await page.locator('[data-select-product="iphone-13-pro"]').click();
              if(!(await page.locator('#modelStage').innerText()).includes('iPhone 13 Pro'))errors.push(name+': model switch failed');
              await page.screenshot({path:'qa-screenshots/iphone-'+name+'.png',fullPage:true});
              if(await page.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth+3))errors.push(name+': horizontal overflow on iPhone');
              await page.locator('[data-consult="iphone-13-pro"]').click();
              if(!(await page.locator('#checkout').evaluate(el=>el.open)))errors.push(name+': checkout failed to open');
              await page.locator('#name').fill('Cliente Teste');
              await page.locator('#phone').fill('33999999999');
              await page.locator('#city').fill('Governador Valadares/MG');
              await page.locator('#address').fill('Rua de teste, 123');
              await page.locator('#consent').check();
              await page.evaluate(()=>{window.__wa='';HTMLAnchorElement.prototype.click=function(){window.__wa=this.href}});
              await page.locator('#checkoutForm button[type="submit"]').click();
              const w=await page.evaluate(()=>window.__wa);
              if(!w.startsWith('https://wa.me/5533987044866?text='))errors.push(name+': checkout WhatsApp URL missing');
              if(!decodeURIComponent(w).includes('Cliente Teste'))errors.push(name+': customer data missing');
              await page.goto('http://127.0.0.1:8765/produto.html?id=iphone-13-pro',{waitUntil:'domcontentloaded'});
              await page.locator('[data-variant="2"]').click();
              if(!(await page.locator('#productDetails').innerText()).includes('Tela e bateria substituídas'))errors.push(name+': variant repair disclosure missing');
              await page.screenshot({path:'qa-screenshots/product-'+name+'.png',fullPage:true});
              await page.goto('http://127.0.0.1:8765/comparar.html',{waitUntil:'domcontentloaded'});
              if(await page.locator('.compare-col').count()!==2)errors.push(name+': compare page failed');
              await page.close();
            }
            for(const slug of ['mac','ipad','watch','airpods','casa','acessorios','sobre']){
              const p=await browser.newPage();
              p.on('pageerror',e=>errors.push(slug+': '+e.message));
              await p.goto('http://127.0.0.1:8765/'+slug+'.html',{waitUntil:'domcontentloaded'});
              if(await p.locator('#app').innerText()==='')errors.push(slug+': empty page');
              if(slug!=='sobre'&&await p.locator('.model-stage').count()!==1)errors.push(slug+': model stage missing');
              await p.close();
            }
            await browser.close();
            if(errors.length){console.error('QA FAILED',errors);process.exit(1)}
            console.log('MD PHONE Universe QA PASSED');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Capturas desktop e celular
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: md-phone-universe-desktop-mobile
          path: qa-screenshots/
          if-no-files-found: warn
      - name: Guardar capturas no repositório
        if: always()
        shell: bash
        run: |
          if ! ls qa-screenshots/*.png >/dev/null 2>&1; then exit 0; fi
          mkdir -p qa-snapshots
          cp qa-screenshots/*.png qa-snapshots/
          git config user.name "MD Phone Visual QA"
          git config user.email "actions@users.noreply.github.com"
          git add qa-snapshots/
          if ! git diff --cached --quiet; then
            git commit -m "QA: capturas MD PHONE Universe em desktop e celular"
            git push
          fi
