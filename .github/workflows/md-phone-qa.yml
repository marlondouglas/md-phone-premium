name: MD PHONE Universe / Teste visual e funcional
on:
  push:
    branches: [main]
    paths:
      - index.html
      - md-universe.css
      - md-universe.js
      - md-universe-data.js
      - scripts/prepare-catalog-media.cjs
      - .github/workflows/pages.yml
      - .github/workflows/md-phone-qa.yml
  workflow_dispatch:

permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obter site
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preparar Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Conferir visual e compra
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-screenshots _site/assets
          cp index.html md-universe.css md-universe.js md-universe-data.js _site/
          cp -R assets/. _site/assets/
          node scripts/prepare-catalog-media.cjs
          python3 -m http.server 8765 --directory _site >/tmp/md-phone-server.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            const errors=[];
            const checks=[];
            for(const [name,width,height] of [['desktop',1440,900],['mobile',390,844]]){
              const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
              page.on('pageerror',e=>errors.push(name+' JS error '+e.message));
              const u='http://127.0.0.1:8765/index.html';
              await page.goto(u,{waitUntil:'domcontentloaded'});
              await page.waitForSelector('.category-tile',{timeout:20000});
              await page.screenshot({path:'qa-screenshots/'+name+'-home.png',fullPage:true});
              let count=await page.locator('.category-tile').count();
              if(count!==7)errors.push(name+': 7 categorias esperadas, recebidas '+count);
              if(await page.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth+4))errors.push(name+': rolagem horizontal na home');
              const catsVisible=await page.locator('.category-tile').first().evaluate(el=>getComputedStyle(el).opacity);
              if(catsVisible==='0')errors.push(name+': cartões de categoria invisíveis');
              if(name==='mobile'){
                await page.locator('#hamburger').click();
                if(!(await page.locator('#mobileMenu').isVisible()))errors.push('menu celular não abre');
              }
              await page.goto(u+'?categoria=iphone',{waitUntil:'domcontentloaded'});
              await page.waitForSelector('.model-stage',{timeout:20000});
              const modelCount=await page.locator('#mdPhoneModel option').count();
              if(modelCount!==31)errors.push(name+': esperado 31 modelos no seletor, encontrado '+modelCount);
              const galleryCount=await page.locator('[data-show-iphone]').count();
              if(galleryCount!==31)errors.push(name+': esperado 31 miniaturas no catálogo completo, encontrado '+galleryCount);
              if(await page.locator('[data-show-iphone]:visible').count()!==31)errors.push(name+': nem todos os modelos aparecem no catálogo inicial');
              await page.locator('[data-show-iphone="iphone-14-plus"]').click();
              if(!(await page.locator('.model-stage h3').innerText()).includes('iPhone 14 Plus'))errors.push(name+': tocar no cartão não abre o aparelho grande');
              if((await page.locator('#mdPhoneModel').inputValue())!=='iphone-14-plus')errors.push(name+': seletor e galeria não ficaram sincronizados');
              if(await page.locator('.model-stage').count()!==1)errors.push(name+': deveria haver apenas um iPhone em destaque');
              if(await page.locator('.model-tab').count()!==0)errors.push(name+': faixa de 31 modelos deveria estar oculta');
              if(await page.locator('[data-phone-era]').count()!==4)errors.push(name+': filtros por geração ausentes');
              await page.locator('#mdPhoneModel').selectOption('iphone-xr');
              if((await page.locator('.md-color-swatch').count())!==6)errors.push(name+': cores do iPhone XR incompletas');
              await page.locator('[data-color-name="Coral"]').click();
              if((await page.locator('.md-color-current').innerText())!=='Coral')errors.push(name+': cor Coral não foi selecionada');
              await page.locator('[data-phone-era="intermediarios"]').click();
              const visibleModels=await page.locator('[data-show-iphone]:visible').count();
              if(visibleModels<7||visibleModels>13)errors.push(name+': filtro 13 ao 15 incorreto, encontrados '+visibleModels);
              await page.locator('[data-phone-era="todos"]').click();
              if(await page.locator('[data-show-iphone]:visible').count()!==31)errors.push(name+': filtro Todos não restitui os 31 iPhones');
              await page.locator('[data-phone-era="intermediarios"]').click();
              await page.locator('#mdPhoneModel').selectOption('iphone-13-pro');
              if(!(await page.locator('.model-stage h3').innerText()).includes('iPhone 13 Pro'))errors.push(name+': troca do modelo falhou');
              if(await page.evaluate(()=>document.documentElement.scrollWidth>window.innerWidth+4))errors.push(name+': rolagem horizontal na vitrine iPhone');
              const vitrine=await page.evaluate(()=>{
                const photo=document.querySelector('.model-art img');
                const title=document.querySelector('.model-info h3');
                const nameSelect=document.querySelector('#mdPhoneModel');
                return {photoFit:photo?getComputedStyle(photo).objectFit:null,
                  titleWidth:title?.scrollWidth||0,titleVisible:title?.clientWidth||0,
                  modelSelectVisible:!!nameSelect&&nameSelect.getClientRects().length>0};
              });
              if(vitrine.photoFit!=='contain')errors.push(name+': foto não usa enquadramento contain');
              if(vitrine.titleWidth>vitrine.titleVisible+5)errors.push(name+': título da vitrine ultrapassa a coluna');
              if(!vitrine.modelSelectVisible)errors.push(name+': seletor compacto oculto');
              await page.waitForTimeout(1400);
              const modelPhoto=await page.locator('.model-art img').evaluate(img=>({loaded:img.complete&&img.naturalWidth>0,src:img.currentSrc}));
              if(!modelPhoto.loaded)errors.push(name+': foto do iPhone 13 Pro não carregou');
              await page.screenshot({path:'qa-screenshots/'+name+'-iphone.png',fullPage:true});
              await page.goto(u+'?produto=iphone-18-pro-max',{waitUntil:'domcontentloaded'});
              await page.waitForSelector('.product-hero',{timeout:20000});
              const title=await page.locator('.product-copy h1').innerText();
              if(!title.includes('iPhone 18 Pro Max'))errors.push(name+': página individual incorreta '+title);
              const colors=await page.locator('[data-color-name]').count();
              if(colors!==4)errors.push(name+': iPhone 18 Pro Max deveria apresentar quatro cores, encontrou '+colors);
              await page.locator('[data-color-name="Preto"]').click();
              if((await page.locator('.md-color-current').innerText())!=='Preto')errors.push(name+': cor Preto não selecionada');
              await page.waitForTimeout(1400);
              const productPhoto=await page.locator('.product-photo img').evaluate(img=>({loaded:img.complete&&img.naturalWidth>0,src:img.currentSrc}));
              if(!productPhoto.loaded)errors.push(name+': foto do iPhone 18 Pro Max não carregou');
              await page.screenshot({path:'qa-screenshots/'+name+'-produto.png',fullPage:true});
              await page.locator('[data-buy]').first().click();
              if(!(await page.locator('#buyDialog').evaluate(el=>el.open)))errors.push(name+': compra não abriu');
              await page.locator('#buyerName').fill('Cliente Teste');
              await page.locator('#buyerPhone').fill('33999999999');
              await page.locator('#buyerConsent').check();
              await page.evaluate(()=>{
                window.__waCaptured='';
                HTMLAnchorElement.prototype.click=function(){window.__waCaptured=this.href;};
              });
              await page.locator('#buyForm button[type=submit]').click();
              const wa=await page.evaluate(()=>window.__waCaptured);
              if(!wa.startsWith('https://wa.me/5533987044866?text='))errors.push(name+': compra não prepara WhatsApp');
              if(!decodeURIComponent(wa).includes('Cor desejada (sujeita à confirmação): Preto'))errors.push(name+': cor escolhida não seguiu para WhatsApp');
              await page.screenshot({path:'qa-screenshots/'+name+'-checkout.png',fullPage:false});
              checks.push({name,categoryCount:count,iphoneModels:modelCount,whatsapp:!!wa});
              await page.close();
            }
            await browser.close();
            console.log('QA RESULTS',JSON.stringify(checks));
            if(errors.length){console.error('QA FAILED',JSON.stringify(errors));process.exit(1)}
            console.log('QA PASSOU');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Salvar imagens do teste
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: md-phone-universe-desktop-mobile
          path: qa-screenshots/
          if-no-files-found: warn
      - name: Publicar capturas para revisão
        if: success()
        shell: bash
        run: |
          mkdir -p qa-snapshots
          cp qa-screenshots/*.png qa-snapshots/
          git config user.name "MD Phone QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add qa-snapshots/
          if ! git diff --cached --quiet; then
            git commit -m "Visual QA: capturas de MD Phone Universe desktop e celular"
            git push
          fi
