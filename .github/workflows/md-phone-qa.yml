name: MD PHONE Elevate / auditoria visual e funcional
on:
  push:
    branches: [main]
    paths:
      - index.html
      - md-elevate.css
      - md-elevate.js
      - md-universe-data.js
      - scripts/prepare-catalog-media.cjs
      - scripts/clean-product-photography.py
      - scripts/render-elevate-film.py
      - .github/workflows/md-phone-qa.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Montar fotos e cinema da vitrine
        run: |
          set -euo pipefail
          mkdir -p _site/assets qa-snapshots
          cp index.html md-elevate.css md-elevate.js md-universe-data.js _site/
          cp -R assets/. _site/assets/
          node --check md-elevate.js
          node --check md-universe-data.js
          node scripts/prepare-catalog-media.cjs
          python3 -m venv /tmp/md-elevate-py
          /tmp/md-elevate-py/bin/python -m pip install --quiet pillow imageio-ffmpeg
          /tmp/md-elevate-py/bin/python scripts/clean-product-photography.py
          /tmp/md-elevate-py/bin/python scripts/render-elevate-film.py
          test -s _site/assets/md-elevate-film.mp4
          python3 -m http.server 8765 --directory _site >/tmp/md-elevate-server.log 2>&1 &
      - name: Auditar o resultado no desktop e iPhone
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const { chromium } = require('playwright');
          (async () => {
          const browser = await chromium.launch({headless:true,args:['--no-sandbox']});
          const errors=[];
          const results=[];
          const expected=['iphone-xr','iphone-11','iphone-12','iphone-13','iphone-13-pro','iphone-14','iphone-14-pro','iphone-14-pro-max','iphone-14-plus','iphone-15','iphone-15-pro','iphone-16-pro-max','iphone-17-pro-max','iphone-18-pro-max'];
          for(const [device,w,h] of [['desktop',1440,900],['mobile',390,844]]){
            const page=await browser.newPage({viewport:{width:w,height:h},deviceScaleFactor:1,reducedMotion:'reduce'});
            page.on('pageerror',err=>errors.push(device+': JavaScript '+err.message));
            await page.goto('http://127.0.0.1:8765/index.html',{waitUntil:'domcontentloaded'});
            await page.locator('.product-card').first().waitFor({timeout:30000});
            const models=await page.locator('.product-card').count();
            if(models!==14)errors.push(device+': esperado 14 cards, encontrado '+models);
            const ids=await page.locator('.product-card').evaluateAll(nodes=>nodes.map(n=>n.dataset.product));
            if(JSON.stringify(ids)!==JSON.stringify(expected))errors.push(device+': modelos não correspondem à lista da loja');
            const variantCount=await page.evaluate(()=>window.MD_UNIVERSE.products.filter(p=>p.category==='iphone').reduce((n,p)=>n+p.variants.filter(v=>Number.isFinite(v.price)).length,0));
            if(variantCount!==20)errors.push(device+': deveria haver 20 versões com preço');
            const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-window.innerWidth);
            if(overflow>4)errors.push(device+': rolagem horizontal de '+overflow+'px');
            const composition=await page.evaluate(()=>{
              const rect=q=>document.querySelector(q).getBoundingClientRect();
              const h=rect('.hero h1'),actions=rect('.hero .button-row'),note=rect('.hero-submeta');
              const visual=rect('.hero-visual img');
              return {headingOverlap:h.bottom>actions.top+4,footOverlap:actions.bottom>note.top+4,photoHeight:visual.height,cardPhotoHeight:rect('.product-card .product-visual').height};
            });
            if(composition.headingOverlap||composition.footOverlap)errors.push(device+': título ou texto invade os botões');
            if(composition.cardPhotoHeight<340)errors.push(device+': foto de produto pequena: '+composition.cardPhotoHeight+'px');
            if(composition.photoHeight<350)errors.push(device+': foto principal pequena: '+composition.photoHeight+'px');
            const photos=await page.locator('.product-card img').evaluateAll(nodes=>nodes.map(img=>({loaded:img.complete&&img.naturalWidth>150,src:img.currentSrc})));
            const loaded=photos.filter(p=>p.loaded).length;
            console.log(device,'fotos carregadas:',loaded,'de',photos.length,'falhas:',JSON.stringify(photos.filter(p=>!p.loaded).slice(0,6)));
            if(loaded<7)errors.push(device+': menos de 7 fotos de produto carregadas (encontradas '+loaded+')');
            if(await page.locator('.assistant-launcher img').count()!==1)errors.push(device+': mascote original ausente');
            const film=await page.locator('#studioVideo source').getAttribute('src');
            if(film!=='assets/md-elevate-film.mp4')errors.push(device+': filme novo não foi integrado');
            const filmResponse=await page.request.get('http://127.0.0.1:8765/assets/md-elevate-film.mp4');
            if(!filmResponse.ok())errors.push(device+': filme não existe na versão montada');
            await page.screenshot({path:'qa-snapshots/elevate-'+device+'-home.png',fullPage:true,animations:'disabled'});
            await page.locator('[data-filter="old"]').click();
            const oldCount=await page.locator('.product-card:visible').count();
            if(oldCount!==3)errors.push(device+': filtro XR–12 deveria mostrar 3 modelos, encontrou '+oldCount);
            await page.locator('[data-filter="all"]').click();
            if(await page.locator('.product-card:visible').count()!==14)errors.push(device+': filtro Todos não restaurou os 14');
            await page.screenshot({path:'qa-snapshots/elevate-'+device+'-catalog.png',fullPage:true,animations:'disabled'});
            await page.locator('[data-product="iphone-11"]').click();
            if(!await page.locator('#productDialog').evaluate(e=>e.open))errors.push(device+': detalhe não abriu');
            if(!await page.locator('#detailPrice').innerText().then(t=>t.includes('1.200')))errors.push(device+': preço do iPhone 11 64GB incorreto');
            await page.locator('[data-variant="1"]').click();
            if(!await page.locator('#detailPrice').innerText().then(t=>t.includes('1.450')))errors.push(device+': preço iPhone 11 128GB não mudou');
            const link=await page.locator('#productWhatsapp').getAttribute('href');
            if(!decodeURIComponent(link).includes('1.450'))errors.push(device+': WhatsApp não inclui preço escolhido');
            await page.screenshot({path:'qa-snapshots/elevate-'+device+'-product.png',animations:'disabled'});
            await page.locator('[data-close="productDialog"]').click();
            await page.locator('#assistantLauncher').click();
            if(!await page.locator('#assistantDialog').evaluate(e=>e.open))errors.push(device+': Assistente MD não abriu');
            if(await page.locator('#helpModel option').count()!==15)errors.push(device+': Assistente não tem 14 modelos e orientação');
            for(const id of ['helpBudget','helpCondition','helpPurchase','helpTiming','helpNotes']){
              if(await page.locator('#'+id).count()!==1)errors.push(device+': faltou a opção '+id);
            }
            await page.screenshot({path:'qa-snapshots/elevate-'+device+'-assistant.png',animations:'disabled'});
            results.push({device,models,loaded,overflow,composition,oldCount,variantCount,video:filmResponse.status()});
            await page.close();
          }
          await browser.close();
          console.log('MD PHONE AUDIT:',JSON.stringify(results));
          if(errors.length){console.error('AUDITORIA REPROVADA:',JSON.stringify(errors));process.exit(1)}
          console.log('AUDITORIA APROVADA');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Registrar capturas de auditoria
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa-snapshots/elevate-*.png
          if ! git diff --cached --quiet; then
            git commit -m "Visual QA: MD PHONE Elevate desktop e mobile"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: md-elevate-visual-audit
          path: qa-snapshots/elevate-*.png
          if-no-files-found: ignore
